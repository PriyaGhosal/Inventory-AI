{% extends "base.html" %}

{% block content %}
<section class="form-card purchase-form-card">
    <p class="eyebrow">Inventory operations</p>
    <h1>New Purchase</h1>
    <p class="muted">New purchases start as pending and do not change stock until received.</p>
    <form method="post" action="{{ url_for('add_purchase') }}">
        <label for="supplier_id">Supplier</label>
        <select id="supplier_id" name="supplier_id" required>
            <option value="">Select a supplier</option>
            {% for supplier in suppliers %}
                <option value="{{ supplier.supplier_id }}" {% if purchase.supplier_id|string == supplier.supplier_id|string %}selected{% endif %}>
                    {{ supplier.supplier_name }}
                </option>
            {% endfor %}
        </select>

        <label for="invoice_number">Invoice Number</label>
        <input id="invoice_number" name="invoice_number" type="text" maxlength="80" value="{{ purchase.invoice_number }}" required>

        <label for="purchase_date">Purchase Date</label>
        <input id="purchase_date" name="purchase_date" type="date" value="{{ purchase.purchase_date }}" required>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3">{{ purchase.notes }}</textarea>

        <div class="items-heading">
            <h2>Purchase Items</h2>
            <button class="button button-small" id="add-item" type="button">Add Item</button>
        </div>
        <div id="purchase-items">
            {% for item in purchase["items"] %}
            <div class="purchase-item-row">
                <div>
                    <label>Product</label>
                    <select name="product_id[]" required>
                        <option value="">Select a product</option>
                        {% for product in products %}
                            <option value="{{ product.product_id }}" {% if item.product_id|string == product.product_id|string %}selected{% endif %}>
                                {{ product.product_name }} ({{ product.sku }}) — stock: {{ product.current_stock }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Quantity</label>
                    <input class="item-quantity" name="quantity[]" type="number" min="1" step="1" value="{{ item.quantity }}" required>
                </div>
                <div>
                    <label>Unit Cost</label>
                    <input class="item-unit-cost" name="unit_cost[]" type="number" min="0" step="0.01" value="{{ item.unit_cost }}" required>
                </div>
                <div>
                    <label>Line Total</label>
                    <output class="item-line-total">₹0.00</output>
                </div>
                <button class="button button-small button-danger remove-item" type="button">Remove</button>
            </div>
            {% endfor %}
        </div>
        <div class="purchase-total">
            <span>Total</span>
            <strong id="purchase-total">₹0.00</strong>
        </div>
        <div class="form-actions">
            <button class="button" type="submit">Create Purchase</button>
            <a class="button button-secondary" href="{{ url_for('purchases') }}">Cancel</a>
        </div>
    </form>
</section>

<template id="purchase-item-template">
    <div class="purchase-item-row">
        <div>
            <label>Product</label>
            <select name="product_id[]" required>
                <option value="">Select a product</option>
                {% for product in products %}
                    <option value="{{ product.product_id }}">{{ product.product_name }} ({{ product.sku }}) — stock: {{ product.current_stock }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Quantity</label>
            <input class="item-quantity" name="quantity[]" type="number" min="1" step="1" required>
        </div>
        <div>
            <label>Unit Cost</label>
            <input class="item-unit-cost" name="unit_cost[]" type="number" min="0" step="0.01" required>
        </div>
        <div>
            <label>Line Total</label>
            <output class="item-line-total">₹0.00</output>
        </div>
        <button class="button button-small button-danger remove-item" type="button">Remove</button>
    </div>
</template>
{% endblock %}
