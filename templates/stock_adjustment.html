{% extends "base.html" %}

{% block content %}
<section class="form-card adjustment-card">
    <p class="eyebrow">Inventory control</p>
    <h1>Adjust Stock</h1>
    <div class="product-summary">
        <strong>{{ product.product_name }}</strong>
        <span>SKU: {{ product.sku }}</span>
        <span>Current stock: {{ product.current_stock }}</span>
    </div>
    <form method="post" action="{{ request.path }}">
        <label for="adjustment_type">Adjustment Type</label>
        <select id="adjustment_type" name="adjustment_type" required>
            <option value="increase" {% if adjustment.adjustment_type == "increase" %}selected{% endif %}>Increase</option>
            <option value="decrease" {% if adjustment.adjustment_type == "decrease" %}selected{% endif %}>Decrease</option>
        </select>

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="1" step="1" value="{{ adjustment.quantity }}" required>

        <label for="notes">Reason / Notes</label>
        <textarea id="notes" name="notes" maxlength="255" rows="4" required>{{ adjustment.notes }}</textarea>

        <div class="form-actions">
            <button class="button" type="submit">Save Adjustment</button>
            <a class="button button-secondary" href="{{ url_for('inventory') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
