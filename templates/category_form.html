{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Inventory setup</p>
    <h1>{{ form_title }}</h1>
    <form method="post" action="{{ request.path }}">
        <label for="category_name">Category Name</label>
        <input
            id="category_name"
            name="category_name"
            type="text"
            maxlength="100"
            value="{{ category.category_name }}"
            required
        >

        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="255" rows="5">{{ category.description or "" }}</textarea>

        <div class="form-actions">
            <button class="button" type="submit">{{ submit_label }}</button>
            <a class="button button-secondary" href="{{ url_for('categories') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
