{% extends "base.html" %}

{% block content %}
<section class="form-card product-form-card">
    <p class="eyebrow">Inventory setup</p>
    <h1>{{ form_title }}</h1>
    <form method="post" action="{{ request.path }}">
        <label for="product_name">Product Name</label>
        <input id="product_name" name="product_name" type="text" maxlength="150" value="{{ product.product_name }}" required>

        <label for="sku">SKU</label>
        <input id="sku" name="sku" type="text" maxlength="50" value="{{ product.sku }}" required>

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>
            <option value="">Select a category</option>
            {% for category in categories %}
                <option value="{{ category.category_id }}" {% if product.category_id|string == category.category_id|string %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>

        <label for="supplier_id">Supplier</label>
        <select id="supplier_id" name="supplier_id">
            <option value="">No Supplier</option>
            {% for supplier in suppliers %}
                <option value="{{ supplier.supplier_id }}" {% if product.supplier_id|string == supplier.supplier_id|string %}selected{% endif %}>
                    {{ supplier.supplier_name }}
                </option>
            {% endfor %}
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="500" rows="4">{{ product.description or "" }}</textarea>

        <label for="unit">Unit</label>
        <input id="unit" name="unit" type="text" maxlength="30" value="{{ product.unit or '' }}" placeholder="piece, kg, litre, box">

        <div class="form-grid">
            <div>
                <label for="cost_price">Cost Price</label>
                <input id="cost_price" name="cost_price" type="number" min="0" step="0.01" value="{{ product.cost_price }}" required>
            </div>
            <div>
                <label for="selling_price">Selling Price</label>
                <input id="selling_price" name="selling_price" type="number" min="0" step="0.01" value="{{ product.selling_price }}" required>
            </div>
            <div>
                <label for="current_stock">Current Stock</label>
                <input id="current_stock" name="current_stock" type="number" min="0" step="1" value="{{ product.current_stock }}" required>
            </div>
            <div>
                <label for="reorder_level">Reorder Level</label>
                <input id="reorder_level" name="reorder_level" type="number" min="0" step="1" value="{{ product.reorder_level }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">{{ submit_label }}</button>
            <a class="button button-secondary" href="{{ url_for('products') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
